name: Dependency Updates

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Update Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r src/terminal-illness/requirements.txt
        pip list --outdated --format=freeze | grep -v '^\-e' | cut -d = -f 1 | xargs -n1 pip install -U || true
        pip freeze | grep -E '^(rich|prompt-toolkit)' > src/terminal-illness/requirements.txt.new
        # Only update if versions changed
        if ! diff -q src/terminal-illness/requirements.txt src/terminal-illness/requirements.txt.new >/dev/null 2>&1; then
          mv src/terminal-illness/requirements.txt.new src/terminal-illness/requirements.txt
        else
          rm src/terminal-illness/requirements.txt.new
        fi
        
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update Python dependencies'
        title: 'Automated Python dependency updates'
        body: |
          ## Dependency Updates
          
          Updated Python dependencies in `src/terminal-illness/requirements.txt`.
        branch: deps/python-updates
          - Please review the changes carefully
          - Run tests to ensure compatibility
          - Check for any breaking changes in updated packages
          
          ---
          *This PR was created automatically by the dependency update workflow*
        branch: dependency-updates
        delete-branch: true
