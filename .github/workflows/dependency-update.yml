name: Dependency Updates

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Update Python dependencies
      run: |
        pip install --upgrade pip

        # Install current deps from both requirement files
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

        # Attempt to upgrade all installed packages
        pip list --outdated --format=freeze | grep -v '^\-e' | cut -d = -f 1 \
          | xargs -n1 pip install -U || true

        # Regenerate pinned runtime requirements (mcp server + web export)
        pip freeze | grep -iE '^(mcp|pyyaml)' > requirements.txt.new

        if ! diff -q requirements.txt requirements.txt.new >/dev/null 2>&1; then
          mv requirements.txt.new requirements.txt
        else
          rm requirements.txt.new
        fi

        # Regenerate pinned dev requirements (tests + linting)
        pip freeze | grep -iE '^(pytest|jsonschema|ruff|yamllint)' \
          > requirements-dev.txt.new

        if ! diff -q requirements-dev.txt requirements-dev.txt.new >/dev/null 2>&1; then
          mv requirements-dev.txt.new requirements-dev.txt
        else
          rm requirements-dev.txt.new
        fi

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update Python dependencies'
        title: 'Automated Python dependency updates'
        body: |
          ## Dependency Updates

          Updated Python dependencies in:
          - `requirements.txt`
          - `requirements-dev.txt`

          Please review the changes carefully, run tests to ensure
          compatibility, and check for any breaking changes.

          ---
          *This PR was created automatically by the dependency update workflow.*
        branch: dependency-updates
        delete-branch: true
