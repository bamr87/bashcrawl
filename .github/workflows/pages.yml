name: GitHub Pages

# Rebuild web/data from the game content, validate the bundle, compile the
# React app (Vite) into web/dist with the engine copied beside it, and deploy
# web/dist to GitHub Pages. CI (ci.yml) already proves the committed bundle
# is fresh on every PR; the rebuild here is belt-and-braces so the deployed
# artifact always matches the content on main.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'entrance/**'
      - 'src/help/data/**'
      - 'termforge/**'
      - 'motion/**'
      - 'courses/**'
      - 'package.json'
      - 'vite.config.mts'
      - 'tsconfig.node.json'
      - 'eslint.config.mjs'
      - 'scripts/build_motion.py'
      - 'scripts/export_static_web.py'
      - 'scripts/validate_static_web.py'
      - 'scripts/validate_runtime_commands.py'
      - 'scripts/vendor_termforge.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Node 24: vitest/jsdom need >= 22 and the fleet installs the latest
      # of everything (no lockfile, so no npm cache to key on).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pyyaml
          npm install --no-audit --no-fund

      - name: Build and validate the web app
        run: make web-test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy Static Web
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
