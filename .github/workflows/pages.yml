name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'entrance/**'
      - 'src/help/data/**'
      - 'scripts/export_static_web.py'
      - 'scripts/validate_static_web.py'
      - 'scripts/validate_runtime_commands.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Build and validate static web app
        run: |
          python3 scripts/export_static_web.py
          python3 scripts/validate_static_web.py
          python3 scripts/validate_runtime_commands.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    name: Deploy Static Web
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
