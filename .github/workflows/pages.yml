name: GitHub Pages

# Rebuild web/data from the game content, validate the bundle, and deploy
# web/ to GitHub Pages. CI (ci.yml) already proves the committed bundle is
# fresh on every PR; the rebuild here is belt-and-braces so the deployed
# artifact always matches the content on main.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'entrance/**'
      - 'src/help/data/**'
      - 'scripts/export_static_web.py'
      - 'scripts/validate_static_web.py'
      - 'scripts/validate_runtime_commands.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install export dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pyyaml

      - name: Build and validate static web app
        run: make web-test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    name: Deploy Static Web
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
