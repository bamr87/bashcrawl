name: Code Quality & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 2'  # Weekly on Tuesday at 4 AM

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Analysis (CodeQL)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  quality-metrics:
    name: Quality Metrics
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Calculate metrics
      run: |
        echo "## Code Quality Metrics" > quality-report.md
        echo "" >> quality-report.md

        total_files=$(find . -type f -not -path './.git/*' | wc -l)
        shell_files=$(find . -name "*.sh" | wc -l)
        python_files=$(find . -name "*.py" | wc -l)
        doc_files=$(find . -name "*.md" | wc -l)
        game_executables=$(find entrance/ -type f -executable 2>/dev/null | wc -l)
        scroll_files=$(find entrance/ -name "scroll" 2>/dev/null | wc -l)

        echo "- **Total Files**: $total_files" >> quality-report.md
        echo "- **Shell Scripts**: $shell_files" >> quality-report.md
        echo "- **Python Files**: $python_files" >> quality-report.md
        echo "- **Documentation**: $doc_files" >> quality-report.md
        echo "- **Game Executables**: $game_executables" >> quality-report.md
        echo "- **Scroll Files**: $scroll_files" >> quality-report.md

        cat quality-report.md

    - name: Upload quality report
      uses: actions/upload-artifact@v5
      with:
        name: quality-report
        path: quality-report.md
