name: Blank-Slate Audit

# Claude Code (authenticated with a subscription OAuth token) plays Bashcrawl
# from scratch through the MCP server, using ONLY on-screen content, and we score
# how far a no-knowledge player gets. Fails if the game stops being self-teaching.
#
# Prerequisite (one-time, by a maintainer): run `claude setup-token` locally and
# add the result as the repository secret CLAUDE_CODE_OAUTH_TOKEN. Without it the
# job is a graceful no-op (the script skips).

on:
  schedule:
    # Weekly, Mondays 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Number of playtest sessions'
        required: false
        default: '3'
      model:
        description: 'Model id for the playing agent'
        required: false
        default: 'claude-sonnet-4-6'
      gate_quest:
        description: 'Median furthest quest the agent must reach (gate)'
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: blank-slate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Blank-slate playthrough
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            test/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run blank-slate playtest + gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLANK_SLATE_MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
          BLANK_SLATE_GATE_QUEST: ${{ github.event.inputs.gate_quest || '3' }}
        run: bash scripts/playtest.sh "${{ github.event.inputs.seeds || '3' }}"

      - name: Upload playtest report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blank-slate-report
          path: |
            test/reports/blank_slate/
            logs/sessions/blank_slate/
          retention-days: 30
