name: Blank-Slate Audit

# Claude Code (authenticated with a subscription OAuth token) plays Bashcrawl
# from scratch through the playtest MCP server (python3 -m playtest.mcp_server),
# using ONLY on-screen content, and we score how far a no-knowledge player gets.
# Fails if the game stops being self-teaching.
#
# Prerequisite (one-time, by a maintainer): run `claude setup-token` locally and
# add the result as the repository secret CLAUDE_CODE_OAUTH_TOKEN. Without it the
# preflight job emits a warning and the audit job is visibly SKIPPED in the run
# list (no toolchain installs, no fake green "audit").

on:
  schedule:
    # Weekly, Mondays 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Number of playtest sessions'
        required: false
        default: '3'
      model:
        description: 'Model id for the playing agent'
        required: false
        default: 'claude-sonnet-4-6'
      gate_rooms:
        description: 'Median rooms visited the agent must reach (gate)'
        required: false
        default: '3'
      gate_scrolls:
        description: 'Median scrolls read the agent must reach (gate)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: blank-slate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Check playtest credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check CLAUDE_CODE_OAUTH_TOKEN
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_token=false" >> "$GITHUB_OUTPUT"
          msg="CLAUDE_CODE_OAUTH_TOKEN secret is not set — no playtest ran and the self-teaching gate did not gate."
          msg="$msg Fix: a maintainer runs 'claude setup-token' locally and adds the result as that repository secret."
          echo "::warning title=Blank-Slate Audit skipped::$msg"
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Blank-Slate Audit — SKIPPED (no credentials)

          The `CLAUDE_CODE_OAUTH_TOKEN` repository secret is not set, so **no playtest ran**
          and the self-teaching gate did not gate anything.

          **Fix (one-time, by a maintainer):** run `claude setup-token` locally and add the
          result as the `CLAUDE_CODE_OAUTH_TOKEN` repository secret.
          SUMMARY

  audit:
    name: Blank-slate playthrough
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # The MCP server needs the 'mcp' package + pyyaml; both are in requirements.txt.
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run blank-slate playtest + gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHONPATH: src
          BLANK_SLATE_MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
          BLANK_SLATE_GATE_ROOMS: ${{ github.event.inputs.gate_rooms || '3' }}
          BLANK_SLATE_GATE_SCROLLS: ${{ github.event.inputs.gate_scrolls || '1' }}
        run: bash scripts/playtest.sh "${{ github.event.inputs.seeds || '3' }}"

      - name: Write run summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          {
            echo "## Blank-Slate Audit"
            echo ""
            echo '```'
            python3 -m playtest.scorer \
              --log-dir logs/sessions/blank_slate \
              --gate-rooms "${{ github.event.inputs.gate_rooms || '3' }}" \
              --gate-scrolls "${{ github.event.inputs.gate_scrolls || '1' }}" \
              || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload playtest report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blank-slate-report
          path: |
            test/reports/blank_slate/
            logs/sessions/blank_slate/
          retention-days: 30
          if-no-files-found: ignore
