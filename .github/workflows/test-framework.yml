name: Test Framework

on:
  push:
    branches: [main, develop]
    paths:
      - 'entrance/**'
      - 'src/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'web/**'
      - '*.sh'
      - 'requirements*.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'entrance/**'
      - 'src/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'web/**'
      - '*.sh'
      - 'requirements*.txt'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      run_ai_tests:
        description: 'Run AI playthrough tests'
        required: false
        default: false
        type: boolean
      scenario:
        description: 'AI scenario to run (all, new_player, critical_path, full_playthrough)'
        required: false
        default: 'critical_path'
        type: string
  schedule:
    # Weekly AI playthrough on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'

permissions:
  contents: read

jobs:
  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ${{ matrix.os }}
    # Cap total runtime (Windows Textual/agent tests can be slow; fail before GHub 6h default)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Make game files executable
        if: runner.os != 'Windows'
        run: bash setup.sh --quick
        env:
          TERM: dumb

      - name: Make game files executable (Windows)
        if: runner.os == 'Windows'
        run: bash setup.sh --quick
        env:
          TERM: dumb

      - name: Configure PYTHONPATH
        shell: python
        run: |
          import os, pathlib
          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          ti = str(ws / "src" / "terminal-illness")
          viewer = str(ws / "src")
          tests = str(ws / "test")
          pypath = ti + os.pathsep + viewer + os.pathsep + tests
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PYTHONPATH={pypath}\n")

      - name: Run unit tests
        shell: bash
        run: bash scripts/run_tests.sh unit
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

      - name: Run integration tests
        shell: bash
        run: bash scripts/run_tests.sh integration
        env:
          BASHCRAWL_ROOT: ${{ github.workspace }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test/reports/
          retention-days: 30

  ai-playthrough:
    name: AI Playthrough Tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_ai_tests == 'true')
    needs: unit-and-integration
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Make game files executable
        run: bash setup.sh --quick
        env:
          TERM: dumb

      - name: Run AI playthrough tests
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/src/terminal-illness:${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/test"
          SCENARIO="${{ github.event.inputs.scenario || 'critical_path' }}"
          if [ "$SCENARIO" = "all" ]; then
            bash scripts/run_tests.sh ai
          else
            cd test
            python -m pytest ai/ -v --tb=long -m ai --timeout=300 \
              -k "$SCENARIO" --junitxml=reports/ai-results.xml
          fi
        env:
          BASHCRAWL_ROOT: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate coverage report
        if: always()
        run: |
          cd test
          python -m analysis.coverage_report \
            --sessions reports/sessions/ \
            --json > reports/coverage.json || true
          python -m analysis.coverage_report \
            --sessions reports/sessions/ > reports/coverage.md || true
        env:
          PYTHONPATH: ${{ github.workspace }}/test

      - name: Upload AI test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-playthrough-results
          path: |
            test/reports/
            test/datasets/golden_sessions/
          retention-days: 90

  log-analysis:
    name: Session Log Analysis
    runs-on: ubuntu-latest
    needs: ai-playthrough
    if: always() && needs.ai-playthrough.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Download AI test artifacts
        uses: actions/download-artifact@v8
        with:
          name: ai-playthrough-results
          path: test/

      - name: Compare with golden sessions
        run: |
          cd test
          for golden in datasets/golden_sessions/*.jsonl; do
            name=$(basename "$golden" .jsonl)
            session_file=$(ls reports/sessions/*.jsonl 2>/dev/null | head -1)
            if [ -n "$session_file" ]; then
              python -m analysis.compare_sessions \
                --golden "$golden" \
                --test "$session_file" > "reports/comparison_${name}.md" || true
            fi
          done
        env:
          PYTHONPATH: ${{ github.workspace }}/test

      - name: Generate AI review
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          cd test
          python -m analysis.generate_review \
            --sessions reports/sessions/ \
            --output reports/ai_review.md || true
        env:
          PYTHONPATH: ${{ github.workspace }}/test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: analysis-reports
          path: test/reports/
          retention-days: 90
