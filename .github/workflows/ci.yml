name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Lint shell scripts (.sh files)
      run: |
        echo "=== ShellCheck: .sh files ==="
        # .shellcheckrc is auto-detected from repo root
        find . -name "*.sh" -not -path "./.git/*" -not -path "./.venv/*" \
          -exec shellcheck {} +

    - name: Lint game executables
      run: |
        echo "=== ShellCheck: game executables ==="
        # Educational game scripts intentionally use classic patterns; only fail on error-level issues.
        for f in $(find entrance/ -type f -executable 2>/dev/null); do
          if head -1 "$f" | grep -q 'bash'; then
            shellcheck --severity=error "$f"
          fi
        done

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Lint YAML files
      uses: ibiqlik/action-yamllint@v3
      with:
        file_or_dir: .
        config_file: .yamllint.yml

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Lint Markdown files
      uses: articulate/actions-markdownlint@v1
      with:
        config: .markdownlint.json
        files: '**/*.md'
        ignore: node_modules
