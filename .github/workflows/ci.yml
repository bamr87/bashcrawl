name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install lint tools
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
    - name: Lint shell scripts
      run: bash scripts/lint.sh shell

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install yamllint
    - name: Lint YAML files
      run: bash scripts/lint.sh yaml

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install lint tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nodejs npm
        sudo npm install -g markdownlint-cli
    - name: Lint Markdown files
      run: bash scripts/lint.sh markdown

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Lint Python files
      run: bash scripts/lint.sh python
