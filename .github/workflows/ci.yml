name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Lint shell scripts
      run: |
        echo "Checking all .sh files and game executables..."
        find . -name "*.sh" -exec shellcheck {} +
        
        # Also check game executables that have bash shebangs
        for f in $(find entrance/ -type f -executable 2>/dev/null); do
          if head -1 "$f" | grep -q 'bash'; then
            shellcheck "$f"
          fi
        done

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Lint YAML files
      run: |
        pip install yamllint
        yamllint -c .yamllint.yml .

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install -r src/terminal-illness/requirements.txt
        
    - name: Verify Python module loads
      run: |
        cd src/terminal-illness
        python -c "import ti; print('Module loads OK')"
