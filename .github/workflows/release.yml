name: 🚀 Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔢 Calculate version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          # Get latest tag and increment
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          version_parts=(${latest_tag//v/})
          IFS='.' read -ra VERSION_ARRAY <<< "${version_parts[0]}"

          case "${{ github.event.inputs.release_type }}" in
            "major")
              new_version="v$((VERSION_ARRAY[0] + 1)).0.0"
              ;;
            "minor")
              new_version="v${VERSION_ARRAY[0]}.$((VERSION_ARRAY[1] + 1)).0"
              ;;
            "patch")
              new_version="v${VERSION_ARRAY[0]}.${VERSION_ARRAY[1]}.$((VERSION_ARRAY[2] + 1))"
              ;;
          esac
          echo "version=$new_version" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: 📝 Generate changelog
      run: |
        echo "# Changelog for ${{ steps.version.outputs.version }}" > changelog.md
        echo "" >> changelog.md

        # Get commits since last tag
        last_tag=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [[ -n "$last_tag" ]]; then
          git log ${last_tag}..HEAD --pretty=format:"- %s (%h)" >> changelog.md
        else
          git log --pretty=format:"- %s (%h)" >> changelog.md
        fi

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body_path: changelog.md
        draft: false
        prerelease: false
