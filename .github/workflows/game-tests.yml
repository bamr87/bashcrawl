name: Game Content Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'entrance/**'
      - 'src/help/**'
      - 'lib/**'
      - '*.sh'
  pull_request:
    branches: [main]
    paths:
      - 'entrance/**'
      - 'src/help/**'
      - 'lib/**'
      - '*.sh'

jobs:
  validate-game:
    name: Validate Game Content
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check scroll files exist in main-path rooms
      run: |
        echo "=== Checking required scroll files ==="
        errors=0

        for dir in entrance entrance/cellar entrance/cellar/armoury entrance/cellar/armoury/chamber; do
          if [[ ! -f "$dir/scroll" ]]; then
            echo "ERROR: Missing scroll in $dir/"
            errors=$((errors + 1))
          else
            lines=$(wc -l < "$dir/scroll")
            if [[ $lines -lt 30 ]]; then
              echo "WARNING: $dir/scroll has only $lines lines (expected 30+)"
            fi
            echo "OK: $dir/scroll ($lines lines)"
          fi
        done

        echo ""
        echo "=== All scroll files found ==="
        find entrance/ -name scroll -type f | sort | while read -r f; do
          echo "  $f ($(wc -l < "$f") lines)"
        done

        [[ $errors -eq 0 ]] && echo "All required scrolls present." || exit 1

    - name: Check game executables have shebangs
      run: |
        echo "=== Checking game executable shebangs ==="
        errors=0

        for name in treasure potion spell statue monster ghost goblet; do
          while IFS= read -r -d '' f; do
            first_line=$(head -1 "$f")
            if [[ "$first_line" != "#!/usr/bin/env bash" && "$first_line" != "#!/bin/bash" ]]; then
              echo "ERROR: $f missing bash shebang (got: $first_line)"
              errors=$((errors + 1))
            else
              echo "OK: $f"
            fi
          done < <(find entrance/ -name "$name" -type f -print0 2>/dev/null)
        done

        [[ $errors -eq 0 ]] && echo "All shebangs correct." || exit 1

    - name: Check game executables have boilerplate
      run: |
        echo "=== Checking boilerplate comments ==="

        for name in treasure potion spell statue monster ghost goblet; do
          while IFS= read -r -d '' f; do
            if ! grep -q "wandered out of bounds" "$f" 2>/dev/null; then
              echo "WARNING: $f missing standard boilerplate comment"
            else
              echo "OK: $f"
            fi
          done < <(find entrance/ -name "$name" -type f -print0 2>/dev/null)
        done

    - name: Check hidden room unlock targets exist
      run: |
        echo "=== Checking unlock mechanism targets ==="
        errors=0

        for dir in .chapel .vault .rift .scrap; do
          visible="${dir#.}"
          if [[ -d "entrance/$dir" ]] || [[ -d "entrance/$visible" ]]; then
            echo "OK: entrance/$dir (or $visible) exists"
          else
            echo "ERROR: entrance/$dir does not exist (unlock target missing)"
            errors=$((errors + 1))
          fi
        done

        [[ $errors -eq 0 ]] && echo "All unlock targets present." || exit 1

    - name: Run game reset dry-run
      run: |
        echo "=== Testing reset script ==="
        bash lib/reset.sh --dry

    - name: Validate walkthrough.json against filesystem
      run: |
        echo "=== Validating walkthrough.json ==="
        errors=0

        if [[ ! -f test/datasets/walkthrough.json ]]; then
          echo "ERROR: walkthrough.json not found"
          exit 1
        fi

        # Check every room in walkthrough.json exists as a directory
        for room in $(python3 -c "import json; data=json.load(open('test/datasets/walkthrough.json')); [print(p) for p in data['rooms']]"); do
          if [[ ! -d "$room" ]]; then
            echo "ERROR: Room directory $room/ does not exist"
            errors=$((errors + 1))
          else
            echo "OK: $room/"
          fi
        done

        # Check rooms with scroll=true have a scroll file
        for room in $(python3 -c "import json; data=json.load(open('test/datasets/walkthrough.json')); [print(p) for p,i in data['rooms'].items() if i.get('scroll')]"); do
          if [[ ! -f "$room/scroll" ]]; then
            echo "ERROR: $room/ marked scroll=true but no scroll file"
            errors=$((errors + 1))
          else
            echo "OK: $room/scroll exists"
          fi
        done

        # Check encounter scripts exist
        for script in $(python3 -c "import json; data=json.load(open('test/datasets/walkthrough.json')); [print(p) for p in data['encounters']]"); do
          if [[ ! -f "$script" ]]; then
            echo "ERROR: Encounter script $script does not exist"
            errors=$((errors + 1))
          else
            echo "OK: $script"
          fi
        done

        echo ""
        if [[ $errors -eq 0 ]]; then
          echo "walkthrough.json validation passed."
        else
          echo "walkthrough.json validation FAILED with $errors errors."
          exit 1
        fi
