[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bashcrawl"
version = "3.2.0"
description = "Terminal adventure game for learning shell fundamentals (terminal-core + web)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
# The game itself is pure bash. Python is only used to build the static web
# bundle (pyyaml) and to run the lean MCP playtest harness (mcp).
dependencies = [
  "pyyaml>=6.0",
  "mcp>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.20",
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.13.0",
]

[project.scripts]
bashcrawl-playtest = "playtest.mcp_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["playtest*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

# The one pytest config (UPS-QA-11). The suites, conftest.py and fixtures live
# in test/. `make test` (scripts/run_tests.sh, run from test/), the single-test
# `cd test && python3 -m pytest unit/<file>` and a bare `pytest` at the root
# (the hub's standard-ci job) all read this table.
[tool.pytest.ini_options]
testpaths = ["test/unit", "test/integration"]
markers = [
  "unit: Deterministic unit tests (no LLM, no subprocess)",
  "integration: Integration tests with real filesystem and bash scripts",
  "slow: Tests that take >30 seconds (combat retries, full playthroughs)",
  "bash: Tests that require a bash-capable environment",
]
addopts = "--timeout=60"
log_cli = true
log_cli_level = "INFO"
