[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bashcrawl"
version = "3.0.0"
description = "Terminal adventure game for learning shell fundamentals (terminal-core + web)"
readme = "README.md"
requires-python = ">=3.10"
# The game itself is pure bash. Python is only used to build the static web
# bundle (pyyaml) and to run the lean MCP playtest harness (mcp).
dependencies = [
  "pyyaml>=6.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.20",
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.13.0",
]

[project.scripts]
bashcrawl-playtest = "playtest.mcp_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["playtest*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
