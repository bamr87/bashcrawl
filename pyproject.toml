[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bashcrawl"
version = "3.0.0"
description = "Terminal adventure game for learning shell fundamentals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
  "flask>=3.0",
  "markdown>=3.5",
  "mcp>=1.0.0",
  "prompt_toolkit>=3.0.47",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7.1",
  "textual>=0.65.0",
  "textual-serve>=1.1.0",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.20",
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.13.0",
]

[project.scripts]
bashcrawl-tui = "ti.main:run"
bashcrawl-agent = "ti.agent:main"
bashcrawl-mcp = "ti.mcp_server:main"
bashcrawl-viewer = "viewer.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "src/terminal-illness"]
include = ["viewer*", "ti*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
