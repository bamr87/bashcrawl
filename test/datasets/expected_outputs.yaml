# Expected output patterns for game scripts
# Used by integration tests to validate script behavior
# Each key is a script path (relative to game root)
# "contains" lists substrings that MUST appear in stdout
# "not_contains" lists substrings that MUST NOT appear

scripts:

  entrance/cellar/treasure:
    contains:
      - "amulet"
      - "export"
    not_contains:
      - "Error"

  entrance/cellar/armoury/treasure:
    contains:
      - "sword"
      - "export"
    not_contains:
      - "Error"

  entrance/cellar/armoury/potion:
    variants:
      accept:
        stdin: "y"
        contains:
          - "HP"
          - "export"
      decline:
        stdin: "n"
        contains:
          - "leave"

  entrance/cellar/armoury/chamber/treasure:
    contains:
      - "export"
    not_contains:
      - "Error"

  entrance/cellar/armoury/chamber/statue:
    variants:
      with_sword:
        env:
          I: "amulet,sword,"
          HP: "15"
        contains:
          - "statue"
      without_sword:
        env:
          I: "amulet,"
          HP: "15"
        contains:
          - "statue"

  entrance/cellar/armoury/chamber/spell:
    variants:
      accept:
        stdin: "y"
        contains:
          - "ln"
      decline:
        stdin: "n"
        not_contains:
          - "Error"
