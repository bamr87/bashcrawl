# AI test scenario definitions for YAML-based configuration
# These supplement the Python scenario dataclasses in test/ai/scenarios.py

scenarios:
  new_player:
    goal: "Learn pwd, ls, cd, cat in entrance and cellar"
    max_turns: 30
    expected_rooms:
      - entrance
      - cellar
    expected_items:
      - amulet
    tags:
      - quick
      - beginner

  critical_path:
    goal: "Follow main path: entrance → cellar → armoury → chamber"
    max_turns: 60
    expected_rooms:
      - entrance
      - cellar
      - armoury
      - chamber
    expected_items:
      - amulet
      - sword
    tags:
      - medium
      - progression

  full_playthrough:
    goal: "Complete entire game from entrance to .rift"
    max_turns: 150
    expected_rooms:
      - entrance
      - cellar
      - armoury
      - chamber
      - chapel
      - vault
      - stronghold
      - rift
    tags:
      - slow
      - full

  stuck_player:
    goal: "Struggle and use help system"
    max_turns: 50
    tags:
      - medium
      - help

  combat_stress:
    goal: "Fight statue, monster, ghost with death and retry"
    max_turns: 80
    initial_inventory: "amulet,sword,"
    initial_hp: 15
    initial_location: "/entrance/cellar/armoury"
    tags:
      - medium
      - combat

  speed_run:
    goal: "Complete core path in minimum commands"
    max_turns: 40
    expected_rooms:
      - cellar
      - armoury
      - chamber
    tags:
      - quick
      - speed
