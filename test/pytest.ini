[pytest]
testpaths = unit integration ai demo
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Deterministic unit tests (no LLM, no subprocess)
    integration: Integration tests with real filesystem and bash scripts
    ai: AI agent-driven tests requiring ANTHROPIC_API_KEY
    demo: Demo walkthrough tests that generate documentation
    slow: Tests that take >30 seconds (combat retries, full playthroughs)

# Default: skip AI and demo tests unless explicitly requested
addopts = -m "not ai and not demo" --timeout=30

# Logging
log_cli = true
log_cli_level = INFO
