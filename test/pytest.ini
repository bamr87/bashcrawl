[pytest]
testpaths = unit integration
markers =
    unit: Deterministic unit tests (no LLM, no subprocess)
    integration: Integration tests with real filesystem and bash scripts
    slow: Tests that take >30 seconds (combat retries, full playthroughs)
    bash: Tests that require a bash-capable environment

addopts = --timeout=60

# Logging
log_cli = true
log_cli_level = INFO
