# ============================================================================
# Bashcrawl Encounter Registry — src/help/data/encounters.yaml
#
# Single source of truth for all executable game scripts. Consumed by:
#   - Static web export (scripts/export_static_web.py)
#   - Web bash emulator (web/assets/js/runtime.js)
#   - Static web export (scripts/export_static_web.py)
#
# Encounter types: loot, combat, puzzle, spell, npc, trap, merchant, riddle
# Adding a new encounter: add an entry here and place the script in the room.
# ============================================================================

