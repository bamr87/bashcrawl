# Single source of truth for all inventory items. Consumed by:
#   - Bash UI layer (lib/ui.sh via lib/room_loader.sh)
#   - Python terminal-illness wrapper (ti/help_data.py)
#
# Item types: weapon, treasure, consumable, armor, quest, key
# Adding a new item: add an entry here; both modes pick it up automatically.
# ============================================================================

