# ============================================================================
# Bashcrawl Quest Definitions — src/help/data/quests.yaml
#
# Single source of truth for all quests. Consumed by:
#   - Python terminal-illness wrapper (src/terminal-illness/ti/quests.py)
#   - Bash quest engine (lib/quests.sh via lib/room_loader.sh)
#   - Bash help system for quest-aware suggestions
#
# The `completion` block provides machine-readable criteria that both the
# Bash and Python engines evaluate generically — no per-quest case logic.
#
# completion fields:
#   command    — the command that must be run (required)
#   location   — pipe-separated room names the player must be in after the
#                command (null = any location)
#   args       — first argument that must match (null = any args)
#   args_file  — file argument that must match (null = any file)
#   item_check — comma-separated items the player must carry (null = none)
#
# Adding a new quest: add an entry here; both engines pick it up.
# ============================================================================

