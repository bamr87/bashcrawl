# ============================================================================
# Bashcrawl motion clips — src/help/data/motion.yaml
#
# Content registry for every piece of art the game draws: the ASCII Motion
# (https://github.com/cameronfoxly/Ascii-Motion) clips that play on the command
# "stage" in the web trainer and the TTY/telnet HUD, and the static art.
# Consumed by scripts/build_motion.py (make web-build), which bundles the
# clips into web/assets/js/fx-clips.js (BashcrawlFxClips +
# BashcrawlFxClipManifest) and the art into web/assets/js/art-clips.js.
# Validated by scripts/validate_content_contracts.py; documented in
# docs/generated/motion.md.
#
# Fields:
#   clips.<motion>.file         ASCII Motion export, relative to the repo root.
#                               Any format the editor writes works: JSON export,
#                               text export, session v1 or v2 (.asciimtn).
#   clips.<motion>.title        Short human name (docs, `make motion`).
#   clips.<motion>.description  What it shows and when it plays.
#   clips.<motion>.stage        false keeps the clip out of the stage band
#                               (bundled, but only playable on request).
#   clips.<motion>.aliases      Other motion names that reuse this clip.
#   art.<name>.file/title/description
#                               Static art the game renders by name
#                               (encounter-<script>, room-<area>, banner, ...).
#   events                      Game events that replace the command's motion,
#                               highest priority first.
#
# The <motion> key must be a motion name from web/assets/js/fx.js (COMMANDS,
# the cd variants, or `error`). Workflow: docs/termforge/ascii-motion.md.
# ============================================================================

version: 1

clips:
  radar:
    file: motion/clips/radar.asciimtn
    title: Radar sweep
    description: A sweep arm rotates around the player's position — pwd, whoami.
    stage: true
    aliases: []

  scan:
    file: motion/clips/scan.asciimtn
    title: Room manifest
    description: A scanline runs down a manifest of the room's exits and items — ls.
    stage: true
    aliases: []

  warp:
    file: motion/clips/warp.asciimtn
    title: Warp ring
    description: A portal ring opens and collapses — cd, and unlocking a hidden room.
    stage: true
    aliases: [climb, rewind, home]

  spark:
    file: motion/clips/spark.asciimtn
    title: Spark burst
    description: Particles scatter outward — quest progress, inventory, xp.
    stage: true
    aliases: []

  cast:
    file: motion/clips/cast.asciimtn
    title: Casting circle
    description: A rune circle charges around a sigil — running ./scripts, and level-ups.
    stage: true
    aliases: []

  steam:
    file: motion/clips/steam.asciimtn
    title: Steam engine
    description: The train puffs across the stage — sl.
    stage: true
    aliases: []

  burn:
    file: motion/clips/burn.asciimtn
    title: Burning crate
    description: A crate catches fire and burns down — rm.
    stage: true
    aliases: []

  error:
    file: motion/clips/error.asciimtn
    title: Warning sign
    description: A flashing "do not enter" sign — unknown commands and failures.
    stage: true
    aliases: []

# Static art: one-frame clips the game prints as `art` lines or draws in
# its panels (rendered with Shell#art). Same file formats as clips.
