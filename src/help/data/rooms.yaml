# ============================================================================
# Bashcrawl Room Registry — src/help/data/rooms.yaml
#
# Single source of truth for all game rooms. Consumed by:
#   - Bash help scripts (src/help/bashcrawl_help.sh)
#   - Static web export (scripts/export_static_web.py)
#
# Adding a new room: add an entry here, create the directory under entrance/,
# and both TUI and Classic modes will pick it up automatically.
# ============================================================================

