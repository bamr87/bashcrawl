    unlocked_by: null
    parent: null
    children: [entrance]
    on_enter: null
    on_exit: null
    description: "The main lobby — gateway to the catacombs"
    teaches:
      - "Starting the game"
    key_files: []
    next_steps: "Type 'cd entrance' to begin"
    essential_commands:
      - command: "cd entrance"
        description: "Enter the catacombs"
      - command: "ls"
        description: "Look around"

