<!DOCTYPE html>
<html lang="en" data-theme="dark" data-resolved="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bashcrawl — learn the terminal by playing</title>
    <meta name="description" content="A free browser dungeon crawl that teaches real bash: take guided courses in a practice lab, explore the story dungeon, drill commands in the Practice Arcade, and keep cheatsheets at hand.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0a14">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bashcrawl — learn the terminal by playing">
    <meta property="og:description" content="Real bash commands. A dungeon that is the filesystem. Free, in your browser.">
    <meta property="og:url" content="https://bamr87.github.io/bashcrawl/">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <!-- Colour mode before first paint (UPS-FE-06): the saved preference,
         with "auto" resolved against the OS. theme-store.ts takes over. -->
    <script>
        (function () {
            try {
                var pref = localStorage.getItem("bashcrawl-web-theme");
                if (pref !== "light" && pref !== "dark" && pref !== "auto") pref = "dark";
                var light = pref === "light" || (pref === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
                document.documentElement.setAttribute("data-theme", pref);
                document.documentElement.setAttribute("data-resolved", light ? "light" : "dark");
            } catch (e) { /* storage blocked: stay dark */ }
        })();
    </script>
</head>
<body>
    <!-- The game ENGINE, as classic scripts in a fixed order: the TermForge
         core (vendored from termforge/core/ by `make web-build` — edit the
         source, never these copies), then the game runtime, its plugins and
         the presenters. The order is a contract: scripts/validate_static_web.py
         checks it, the node test harness mirrors it. `vite-ignore` keeps the
         bundler's hands off them; vite.config.mts ships them into dist. -->
    <script src="./assets/js/vendor/termforge/protocol.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/parser.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/state.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/vfs.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/hooks.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/registry.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/events.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/rules.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/plugin.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/curriculum.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/mastery.js" vite-ignore></script>
    <script src="./assets/js/vendor/termforge/explain.js" vite-ignore></script>

    <script src="./assets/js/vendor/termforge/input.js" vite-ignore></script>

    <script src="./assets/js/vendor/termforge/art.js" vite-ignore></script>

    <!-- The React app (web/src, built by Vite). A module script runs after
         every classic script above, so the engine globals are ready. -->

    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
