    title: "TODO: the first thing a user does here"
    description: "TODO: replace with the primary user-facing capability of bashcrawl."
    implemented: true
    surface: ui
    link: /
    docs: README.md
    tags: [todo]
    tests: []
    scenarios:
      - verify/scenarios/smoke-home.yml
    evidence: []
